<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="cs-title cs-desc" xml:lang="en" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="cs-title">Central Info Station (CIS) — Retrieve, don’t read.</title>
<desc id="cs-desc">Four-stage flow: Sources (decision log, plans, docs, agent rules, memory, git history, code graph) are indexed as references only (.cis), retrieved as exact excerpts with ctx, and enforced by hooks (SessionStart card, read gate, git hooks, miss log). Measured: session-start context 50 KB to 4 KB, answers up to 3 KB, gate cost about 40 ms, zero dependencies.</desc>
