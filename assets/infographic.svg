<text x="112" y="109" font-size="22" font-weight="600" fill="#1D4ED8">Retrieve, don’t read.</text>
<text x="112" y="140" font-size="15" fill="#4B5563">A self-updating index + enforcement hooks that keep AI coding agents oriented in big projects.</text>
