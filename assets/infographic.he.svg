<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="cs-title cs-desc" xml:lang="he" font-family="Rubik, 'Segoe UI', Arial, sans-serif" direction="rtl">
<title id="cs-title">Central Info Station (CIS) — לשלוף, לא לקרוא.</title>
<desc id="cs-desc">זרימה בארבעה שלבים: מקורות (יומן החלטות, תוכניות, מסמכים, כללי סוכן, זיכרון, היסטוריית git, גרף קוד) נכנסים לאינדקס של הפניות בלבד (.cis), נשלפים כקטע מדויק עם ctx, ונאכפים בהוקים (כרטיס SessionStart, שער קריאה, git hooks, יומן פספוסים). נמדד: הקשר בפתיחת סשן מ-50 KB ל-4 KB, תשובה עד 3 KB, עלות השער כ-40 ms, אפס תלויות.</desc>
<rect x="0.75" y="0.75" width="1198.5" height="718.5" rx="20" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
