<text x="1088" y="76" font-size="38" font-weight="700" fill="#0F2B4C" direction="ltr" text-anchor="end">Central Info Station <tspan fill="#1D4ED8">· CIS</tspan></text>
<text x="1088" y="109" font-size="24" font-weight="600" fill="#1D4ED8" direction="rtl" text-anchor="start">לשלוף, לא לקרוא.</text>
<text x="1088" y="140" font-size="16" fill="#4B5563" direction="rtl" text-anchor="start">אינדקס שמתעדכן מעצמו + הוקים שאוכפים את השימוש בו — כדי שסוכני קוד AI לא יאבדו כיוון בפרויקטים גדולים.</text>
